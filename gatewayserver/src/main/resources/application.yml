spring:
  application:
    name: gatewayserver
  config:
   import: "optional:configserver:http://localhost:8071/"
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false    # Enable service discovery for routes
              ## we used gateway dependency not gateway-webmvc dependency
              lower-case-service-id: true
  data:
    redis:
      connection-timeout: 2s
      host: localhost
      port: 6379
      timeout: 1s
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      access: unrestricted
  info:
    env:
      enabled: true

info:
  app:
    name: gatewayserver
    description: "eazybank Gateway Server"
    version: "1.0.0"

logging:
  level:
    com:
      yuosef:
        gatewayserver: DEBUG

resilience4j.circuitbreaker:
  configs:
    default:
      sliding-window-size: 5
      permittedNumberOfCallsInHalfOpenState: 2
      failure-rate-threshold: 50
      wait-duration-in-open-state: 10000


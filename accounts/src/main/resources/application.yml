spring:
  application:
    name: "accounts"
  profiles:
    active: "prod"
  config:
    import: "optional:configserver:http://localhost:8071"
  datasource:
    url: jdbc:mysql://localhost:3306/accountsdb
    username: root
    password: root
  jpa:
    show-sql: true
  sql:
    init:
      mode: always
  rabbitmq:
    host: "localhost"
    port: 5672
    username: "guest"
    password: "guest"
server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  endpoint:
    shutdown:
      access: unrestricted   # allow shutdown endpoint to be accessed from any IP
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true   # enable env info endpoint

eureka:
  instance:
    prefer-ip-address: true     # prefer IP address over hostname in Eureka registry to avoid issues with Docker container names
  client:
    fetch-registry: true       # fetch registry from Eureka server to get service information of other services
    register-with-eureka: true  # register with Eureka server to be discovered by other services
    service-url:
      defaultZone: http://localhost:8070/eureka/     # Eureka server URL

info:           # application info will be exposed at /info endpoint
  app:
    name: "accounts"
    description: "Eazy Bank accounts application"
    version: "1.0.0"

logging:
  level:
    com:
      yuosef:
        accounts: DEBUG